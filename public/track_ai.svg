<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" fill="none">
  <defs>
    <linearGradient id="bg-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29" />
      <stop offset="60%" stop-color="#0b1b17" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="border-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow-ai" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#042f2e" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="10" y="8" width="100" height="74" rx="14" fill="url(#bg-ai)" stroke="url(#border-ai)" stroke-width="2" filter="url(#shadow-ai)" />

  <!-- Synapse Lines -->
  <line x1="32" y1="32" x2="60" y2="45" stroke="#10b981" stroke-width="2" stroke-opacity="0.7" />
  <line x1="32" y1="58" x2="60" y2="45" stroke="#10b981" stroke-width="2" stroke-opacity="0.7" />
  <line x1="60" y1="45" x2="88" y2="32" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.7" />
  <line x1="60" y1="45" x2="88" y2="58" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.7" />
  <line x1="32" y1="32" x2="32" y2="58" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.5" />
  <line x1="88" y1="32" x2="88" y2="58" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.5" />

  <!-- Peripheral Nodes -->
  <circle cx="32" cy="32" r="6" fill="#064e3b" stroke="#34d399" stroke-width="2" />
  <circle cx="32" cy="32" r="2.5" fill="#a7f3d0" />
  
  <circle cx="32" cy="58" r="6" fill="#064e3b" stroke="#34d399" stroke-width="2" />
  <circle cx="32" cy="58" r="2.5" fill="#a7f3d0" />

  <circle cx="88" cy="32" r="6" fill="#064e3b" stroke="#2dd4bf" stroke-width="2" />
  <circle cx="88" cy="32" r="2.5" fill="#99f6e4" />

  <circle cx="88" cy="58" r="6" fill="#064e3b" stroke="#2dd4bf" stroke-width="2" />
  <circle cx="88" cy="58" r="2.5" fill="#99f6e4" />

  <!-- Central Intelligence AI Core -->
  <circle cx="60" cy="45" r="14" fill="#022c22" stroke="url(#core-glow)" stroke-width="2.5" />
  <circle cx="60" cy="45" r="7" fill="url(#core-glow)" />
  <polygon points="60,37 62,43 68,45 62,47 60,53 58,47 52,45 58,43" fill="#ffffff" />
</svg>
