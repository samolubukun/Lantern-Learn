<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" fill="none">
  <defs>
    <linearGradient id="bg-des" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="border-des" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="pen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow-des" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="10" y="8" width="100" height="74" rx="14" fill="url(#bg-des)" stroke="url(#border-des)" stroke-width="2" filter="url(#shadow-des)" />

  <!-- Layout Frame Guides -->
  <rect x="22" y="20" width="76" height="50" rx="6" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3" />
  
  <!-- Swatch Circles -->
  <circle cx="34" cy="32" r="5" fill="#f43f5e" />
  <circle cx="48" cy="32" r="5" fill="#a855f7" />
  <circle cx="62" cy="32" r="5" fill="#10b981" />
  <circle cx="76" cy="32" r="5" fill="#fbbf24" />

  <!-- Vector Bezier Curve -->
  <path d="M26 62 C 40 40, 70 70, 94 48" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" />
  
  <!-- Pen Tool Icon -->
  <g transform="translate(56, 44) rotate(-35)">
    <path d="M0 0 L10 -4 L18 10 L14 18 Z" fill="url(#pen-grad)" stroke="#1e293b" stroke-width="1" />
    <polygon points="0,0 4,-1 1,4" fill="#0f172a" />
    <circle cx="9" cy="6" r="1.5" fill="#10b981" />
  </g>

  <!-- Anchor Handle Points -->
  <rect x="24" y="60" width="4" height="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1" />
  <rect x="92" y="46" width="4" height="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1" />
</svg>
