<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Muted Dusky Smoke Aura (Zero Green) -->
    <radialGradient id="badAura" cx="50" cy="52" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#64748B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0"/>
    </radialGradient>

    <!-- Dark Cold Iron Metal -->
    <linearGradient id="coldIron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Muted Antique Brass -->
    <linearGradient id="dullBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="40%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Dim Cold Glass -->
    <radialGradient id="coldGlass" cx="50" cy="52" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#E2E8F0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <!-- Cold Background Aura -->
  <circle cx="50" cy="52" r="44" fill="url(#badAura)"/>

  <!-- Top Handle -->
  <path d="M34 22 C34 9, 66 9, 66 22" stroke="url(#dullBrass)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="34" cy="22" r="2.2" fill="url(#dullBrass)"/>
  <circle cx="66" cy="22" r="2.2" fill="url(#dullBrass)"/>
  <circle cx="50" cy="14" r="5" stroke="url(#dullBrass)" stroke-width="2.5" fill="none"/>

  <!-- Chimney Cap -->
  <path d="M42 22 L45 17 L55 17 L58 22 Z" fill="url(#dullBrass)"/>
  <rect x="47" y="19" width="2" height="1.5" rx="0.5" fill="#334155"/>
  <rect x="51" y="19" width="2" height="1.5" rx="0.5" fill="#334155"/>

  <!-- Upper Cold Iron Hood -->
  <path d="M26 31 C28 24, 38 21, 50 21 C62 21, 72 24, 74 31 Z" fill="url(#coldIron)"/>
  <rect x="24" y="30.5" width="52" height="4" rx="2" fill="url(#dullBrass)"/>

  <!-- Glass Mantle -->
  <rect x="28" y="34" width="44" height="40" rx="9" fill="url(#coldGlass)" stroke="url(#coldIron)" stroke-width="2.5"/>

  <!-- Vertical Cage Struts -->
  <line x1="38" y1="34" x2="38" y2="74" stroke="url(#dullBrass)" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="62" y1="34" x2="62" y2="74" stroke="url(#dullBrass)" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Burner Base & Extinguished Wick -->
  <rect x="45" y="65" width="10" height="4" rx="1.5" fill="url(#dullBrass)"/>
  <rect x="48.5" y="62" width="3" height="4" rx="1" fill="#1E293B"/>

  <!-- Faint Smoke Wisp curling up (Extinguished Flame) -->
  <path d="M50 60 C53 56, 47 52, 51 46 C54 42, 48 38, 52 34" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <circle cx="50" cy="62" r="1.5" fill="#EF4444" opacity="0.8"/> <!-- tiny cooling red ember -->

  <!-- Distressed Sad Flame Eyes in the Smoke -->
  <circle cx="46" cy="48" r="1.8" fill="#64748B"/>
  <circle cx="54" cy="48" r="1.8" fill="#64748B"/>
  <path d="M47 53 Q50 50.5 53 53" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Base -->
  <rect x="24" y="73.5" width="52" height="4" rx="2" fill="url(#dullBrass)"/>
  <path d="M22 84 L26 77 L74 77 L78 84 Z" fill="url(#coldIron)"/>
  <rect x="20" y="83" width="60" height="5" rx="2.5" fill="url(#dullBrass)"/>
  <rect x="24" y="87" width="52" height="3" rx="1.5" fill="#0F172A"/>

  <ellipse cx="50" cy="91" rx="22" ry="3" fill="#0F172A" opacity="0.2"/>
</svg>