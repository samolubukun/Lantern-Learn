<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radiant Warm Amber Aura (Zero Green) -->
    <radialGradient id="lanternAura" cx="50" cy="52" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#FDE047" stop-opacity="0.38"/>
      <stop offset="75%" stop-color="#F59E0B" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Forged Obsidian / Dark Bronze Hardware -->
    <linearGradient id="ironMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Polished Radiant Brass & Gold Trim -->
    <linearGradient id="brassTrim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Glass Chamber Radiant Glow -->
    <radialGradient id="glassCore" cx="50" cy="52" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFFBEB"/>
      <stop offset="70%" stop-color="#FEF08A" stop-opacity="0.9"/>
      <stop offset="90%" stop-color="#FDE68A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Living Flame Core -->
    <linearGradient id="flameGrad" x1="50" y1="36" x2="50" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Light Sphere -->
  <circle cx="50" cy="52" r="44" fill="url(#lanternAura)"/>

  <!-- ============================================== -->
  <!-- LANTERN HARDWARE (Forged Obsidian & Gold)      -->
  <!-- ============================================== -->

  <!-- Top Overhead Brass Hanging Arch Handle -->
  <path d="M34 22 C34 9, 66 9, 66 22" stroke="url(#brassTrim)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Handle Hinge Mounts -->
  <circle cx="34" cy="22" r="2.2" fill="url(#brassTrim)"/>
  <circle cx="66" cy="22" r="2.2" fill="url(#brassTrim)"/>

  <!-- Top Finial Ring -->
  <circle cx="50" cy="14" r="5" stroke="url(#brassTrim)" stroke-width="2.5" fill="none"/>

  <!-- Chimney Cap (Tiered Brass Dome) -->
  <path d="M42 22 L45 17 L55 17 L58 22 Z" fill="url(#brassTrim)"/>
  <!-- Heat Vents -->
  <rect x="47" y="19" width="2" height="1.5" rx="0.5" fill="#78350F" opacity="0.8"/>
  <rect x="51" y="19" width="2" height="1.5" rx="0.5" fill="#78350F" opacity="0.8"/>

  <!-- Upper Forged Obsidian Hood -->
  <path d="M26 31 C28 24, 38 21, 50 21 C62 21, 72 24, 74 31 Z" fill="url(#ironMetal)"/>
  <rect x="24" y="30.5" width="52" height="4" rx="2" fill="url(#brassTrim)"/>

  <!-- Glass Mantle / Cylinder -->
  <rect x="28" y="34" width="44" height="40" rx="9" fill="url(#glassCore)" stroke="url(#ironMetal)" stroke-width="2.5"/>

  <!-- Protective Brass Cage Struts -->
  <line x1="38" y1="34" x2="38" y2="74" stroke="url(#brassTrim)" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <line x1="62" y1="34" x2="62" y2="74" stroke="url(#brassTrim)" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>

  <!-- Glass Surface Specular Glare -->
  <path d="M32 38 C32 36, 36 35, 42 35" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
  <line x1="31" y1="42" x2="31" y2="66" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>

  <!-- ============================================== -->
  <!-- VIBRANT DANCING FLAME CORE (Inside Chamber)    -->
  <!-- ============================================== -->
  <g filter="url(#flameGlow)">
    <!-- Brass Burner Nozzle on Wick -->
    <rect x="45" y="65" width="10" height="4" rx="1.5" fill="url(#brassTrim)"/>
    <!-- The Flame Teardrop -->
    <path d="M50 38 C54 44, 61 50, 60 58 C59 65, 54 68, 50 68 C46 68, 41 65, 40 58 C39 50, 46 44, 50 38 Z" fill="url(#flameGrad)"/>
    <!-- White Hot Incandescent Center -->
    <ellipse cx="50" cy="59" rx="4" ry="6" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Friendly Expressive Flame Mascot Eyes -->
  <ellipse cx="46.5" cy="54" rx="1.8" ry="2.6" fill="#78350F"/>
  <circle cx="47.2" cy="53.2" r="0.8" fill="#FFFFFF"/>
  <ellipse cx="53.5" cy="54" rx="1.8" ry="2.6" fill="#78350F"/>
  <circle cx="54.2" cy="53.2" r="0.8" fill="#FFFFFF"/>
  <!-- Happy Flame Smile -->
  <path d="M47.5 59 Q50 61.5 52.5 59" stroke="#78350F" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- ============================================== -->
  <!-- BASE & OIL RESERVOIR (Forged Obsidian & Gold)  -->
  <!-- ============================================== -->
  <!-- Lower Brass Collar -->
  <rect x="24" y="73.5" width="52" height="4" rx="2" fill="url(#brassTrim)"/>

  <!-- Side Wick Adjustment Knob -->
  <rect x="74" y="74.5" width="3.5" height="2" rx="0.5" fill="url(#brassTrim)"/>
  <circle cx="78.5" cy="75.5" r="2" fill="url(#brassTrim)"/>

  <!-- Flanged Sturdy Pedestal Base -->
  <path d="M22 84 L26 77 L74 77 L78 84 Z" fill="url(#ironMetal)"/>
  <rect x="20" y="83" width="60" height="5" rx="2.5" fill="url(#brassTrim)"/>
  <rect x="24" y="87" width="52" height="3" rx="1.5" fill="#0F172A"/>

  <!-- Soft Base Ground Shadow -->
  <ellipse cx="50" cy="91" rx="24" ry="3.5" fill="#0F172A" opacity="0.25"/>
</svg>
