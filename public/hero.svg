<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Center Solar Halo (Zero Green) -->
    <radialGradient id="heroCenterGlow" cx="300" cy="300" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#FDE047" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Upward Beaming Golden Light Cone -->
    <linearGradient id="lightBeam" x1="300" y1="320" x2="300" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#FEF08A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0"/>
    </linearGradient>

    <!-- Forged Obsidian Steel Metal (Zero Green) -->
    <linearGradient id="ironGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Radiant Polished Gold & Brass -->
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Crystal Chamber Glow -->
    <radialGradient id="chamberGlow" cx="300" cy="325" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#FBBF24"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <!-- Floating Cards -->
    <linearGradient id="codeCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowHeavy" x="-20%" y="-20%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>

    <filter id="lanternGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#F59E0B" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Ambient Light Halo -->
  <circle cx="300" cy="300" r="260" fill="url(#heroCenterGlow)"/>

  <!-- Light Beam Casting Upwards from the Lantern -->
  <polygon points="260,320 340,320 440,40 160,40" fill="url(#lightBeam)"/>

  <!-- Celestial Orbital Rings / Horizon (Zero Green) -->
  <ellipse cx="300" cy="455" rx="230" ry="60" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.35"/>
  <ellipse cx="300" cy="470" rx="170" ry="42" stroke="#FBBF24" stroke-width="2" opacity="0.45"/>
  <ellipse cx="300" cy="480" rx="100" ry="25" fill="#F59E0B" opacity="0.12"/>

  <!-- ============================================== -->
  <!-- Floating Holographic Knowledge Cards           -->
  <!-- ============================================== -->

  <!-- Card 1: Top Right - Code Block (Next.js / TypeScript) -->
  <g filter="url(#shadowHeavy)" transform="translate(370, 75) rotate(4)">
    <rect width="180" height="110" rx="16" fill="url(#codeCardGrad)" stroke="#334155" stroke-width="1.5"/>
    <!-- Window Dots -->
    <circle cx="20" cy="18" r="4.5" fill="#EF4444"/>
    <circle cx="34" cy="18" r="4.5" fill="#F59E0B"/>
    <circle cx="48" cy="18" r="4.5" fill="#38BDF8"/>
    <!-- Code Lines -->
    <rect x="20" y="38" width="55" height="7" rx="3.5" fill="#38BDF8"/>
    <rect x="80" y="38" width="70" height="7" rx="3.5" fill="#A855F7"/>
    <rect x="30" y="55" width="90" height="7" rx="3.5" fill="#FBBF24"/>
    <rect x="30" y="72" width="60" height="7" rx="3.5" fill="#FDE047"/>
    <rect x="95" y="72" width="40" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="20" y="89" width="30" height="7" rx="3.5" fill="#38BDF8"/>
  </g>

  <!-- Card 2: Top Left - AI & Neural Intelligence -->
  <g filter="url(#shadowHeavy)" transform="translate(50, 110) rotate(-6)">
    <rect width="160" height="95" rx="16" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="45" cy="47" r="22" fill="#EEF2FF"/>
    <!-- AI Brain Spark -->
    <path d="M45 32 L48 42 L58 45 L48 48 L45 58 L42 48 L32 45 L42 42 Z" fill="#6366F1"/>
    <circle cx="45" cy="45" r="3" fill="#FFFFFF"/>
    <rect x="76" y="35" width="65" height="9" rx="4" fill="#1E293B"/>
    <rect x="76" y="50" width="45" height="7" rx="3.5" fill="#64748B"/>
    <rect x="76" y="63" width="55" height="6" rx="3" fill="#94A3B8"/>
  </g>

  <!-- Card 3: Bottom Right - XP Points & Streak -->
  <g filter="url(#shadowHeavy)" transform="translate(370, 390) rotate(5)">
    <rect width="170" height="64" rx="32" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2.5"/>
    <circle cx="36" cy="32" r="20" fill="#FEF3C7"/>
    <!-- Lightning Bolt -->
    <path d="M37 20L28 32H35L33 44L44 30H37L39 20Z" fill="#F59E0B"/>
    <text x="68" y="30" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#0F172A">+150 XP</text>
    <text x="68" y="47" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#D97706">STREAK UNLOCKED</text>
  </g>

  <!-- ============================================== -->
  <!-- CENTERPIECE: The Architectural LANTERN         -->
  <!-- ============================================== -->

  <!-- Pedestal Base Shadow -->
  <ellipse cx="300" cy="468" rx="90" ry="22" fill="#0F172A" opacity="0.3" filter="url(#shadowHeavy)"/>

  <!-- Top Overhead Brass Hanging Arch Handle -->
  <path d="M245 200 C245 130, 355 130, 355 200" stroke="url(#brassGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="245" cy="200" r="7" fill="url(#brassGrad)"/>
  <circle cx="355" cy="200" r="7" fill="url(#brassGrad)"/>

  <!-- Top Finial Ring -->
  <circle cx="300" cy="150" r="16" stroke="url(#brassGrad)" stroke-width="8" fill="none"/>

  <!-- Lantern Roof / Chimney Cap (Tiered Brass Dome) -->
  <path d="M270 195 L280 170 L320 170 L330 195 Z" fill="url(#brassGrad)"/>
  <rect x="288" y="178" width="6" height="5" rx="1.5" fill="#78350F" opacity="0.8"/>
  <rect x="306" y="178" width="6" height="5" rx="1.5" fill="#78350F" opacity="0.8"/>

  <!-- Upper Forged Obsidian Hood (Zero Green) -->
  <path d="M210 230 C215 205, 250 195, 300 195 C350 195, 385 205, 390 230 Z" fill="url(#ironGrad)"/>
  <rect x="205" y="228" width="190" height="12" rx="6" fill="url(#brassGrad)"/>

  <!-- Crystal Glass Mantle (Radiant Glowing Cylinder) -->
  <rect x="220" y="240" width="160" height="160" rx="28" fill="url(#chamberGlow)" stroke="url(#ironGrad)" stroke-width="8" filter="url(#lanternGlow)"/>

  <!-- Protective Vertical Brass Struts / Cage Bars -->
  <line x1="255" y1="240" x2="255" y2="400" stroke="url(#brassGrad)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <line x1="345" y1="240" x2="345" y2="400" stroke="url(#brassGrad)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

  <!-- Curved Glass Surface Glare / Reflection Lines -->
  <path d="M236 260 C236 250, 250 245, 275 245" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
  <line x1="232" y1="280" x2="232" y2="370" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.65"/>

  <!-- Internal Brass Burner Base -->
  <rect x="270" y="370" width="60" height="15" rx="5" fill="url(#brassGrad)"/>

  <!-- The Blazing Living Core Flame -->
  <path d="M300 255 C320 280, 345 305, 340 338 C335 365, 318 375, 300 375 C282 375, 265 365, 260 338 C255 305, 280 280, 300 255 Z" fill="#F97316"/>
  <ellipse cx="300" cy="335" rx="22" ry="30" fill="#FEF08A"/>
  <ellipse cx="300" cy="342" rx="11" ry="16" fill="#FFFFFF"/>

  <!-- Lower Brass Collar -->
  <rect x="205" y="400" width="190" height="12" rx="6" fill="url(#brassGrad)"/>

  <!-- Knurled Wick Adjustment Dial on side -->
  <rect x="390" y="402" width="12" height="8" rx="2" fill="url(#brassGrad)"/>
  <circle cx="406" cy="406" r="6" fill="url(#brassGrad)"/>

  <!-- Sturdy Flanged Obsidian Pedestal Base (Zero Green) -->
  <path d="M195 440 L210 412 L390 412 L405 440 Z" fill="url(#ironGrad)"/>
  <rect x="190" y="438" width="220" height="16" rx="8" fill="url(#brassGrad)"/>
  <rect x="210" y="454" width="180" height="10" rx="5" fill="#0F172A"/>

  <!-- ============================================== -->
  <!-- Ambient Sparks & Constellation Stars           -->
  <!-- ============================================== -->
  <path d="M160 220L163 228L171 231L163 234L160 242L157 234L149 231L157 228L160 220Z" fill="#FDE047"/>
  <path d="M440 210L442 216L448 218L442 220L440 226L438 220L432 218L438 216L440 210Z" fill="#FDE047"/>
  <circle cx="290" cy="115" r="3.5" fill="#FBBF24" opacity="0.8"/>
  <circle cx="190" cy="160" r="2.5" fill="#FBBF24" opacity="0.7"/>
  <circle cx="410" cy="140" r="3" fill="#60A5FA" opacity="0.6"/>
  <circle cx="480" cy="300" r="2.5" fill="#FDE047" opacity="0.7"/>
  <circle cx="110" cy="270" r="3" fill="#F59E0B" opacity="0.6"/>
</svg>