<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" fill="none">
  <defs>
    <linearGradient id="bg-biz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="border-biz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="gold-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="green-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow-biz" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="10" y="8" width="100" height="74" rx="14" fill="url(#bg-biz)" stroke="url(#border-biz)" stroke-width="2" filter="url(#shadow-biz)" />

  <!-- Grid lines -->
  <line x1="22" y1="64" x2="98" y2="64" stroke="#334155" stroke-width="1.5" />
  <line x1="22" y1="46" x2="98" y2="46" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" opacity="0.4" />
  <line x1="22" y1="28" x2="98" y2="28" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" opacity="0.4" />

  <!-- Ascending Growth Bars -->
  <rect x="28" y="50" width="10" height="14" rx="3" fill="url(#green-bar)" />
  <rect x="44" y="40" width="10" height="24" rx="3" fill="url(#green-bar)" />
  <rect x="60" y="32" width="10" height="32" rx="3" fill="url(#green-bar)" />
  <rect x="76" y="22" width="10" height="42" rx="3" fill="url(#gold-bar)" />

  <!-- Upward Trend Line & Arrow -->
  <path d="M26 56 Q 48 44 65 30 T 88 18" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  <polygon points="86,14 94,18 89,24" fill="#fbbf24" />

  <!-- Golden Beacon Star -->
  <circle cx="89" cy="19" r="4" fill="#fef08a" opacity="0.6" />
</svg>
