<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Contemplative Halo (Zero Green) -->
    <radialGradient id="sadAura" cx="50" cy="52" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FDE047" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Forged Slate Iron Metal -->
    <linearGradient id="slateIron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="45%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Warm Polished Brass -->
    <linearGradient id="warmBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Gentle Warm Chamber Glow -->
    <radialGradient id="gentleChamber" cx="50" cy="54" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FEF08A" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#FDE68A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.2"/>
    </radialGradient>

    <!-- Gentle Small Flame Gradient -->
    <linearGradient id="smallFlameGrad" x1="50" y1="46" x2="50" y2="67" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Ambient Light Halo -->
  <circle cx="50" cy="52" r="44" fill="url(#sadAura)"/>

  <!-- Top Handle -->
  <path d="M34 22 C34 9, 66 9, 66 22" stroke="url(#warmBrass)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="34" cy="22" r="2.2" fill="url(#warmBrass)"/>
  <circle cx="66" cy="22" r="2.2" fill="url(#warmBrass)"/>
  <circle cx="50" cy="14" r="5" stroke="url(#warmBrass)" stroke-width="2.5" fill="none"/>

  <!-- Chimney Cap -->
  <path d="M42 22 L45 17 L55 17 L58 22 Z" fill="url(#warmBrass)"/>
  <rect x="47" y="19" width="2" height="1.5" rx="0.5" fill="#78350F" opacity="0.8"/>
  <rect x="51" y="19" width="2" height="1.5" rx="0.5" fill="#78350F" opacity="0.8"/>

  <!-- Upper Forged Iron Hood -->
  <path d="M26 31 C28 24, 38 21, 50 21 C62 21, 72 24, 74 31 Z" fill="url(#slateIron)"/>
  <rect x="24" y="30.5" width="52" height="4" rx="2" fill="url(#warmBrass)"/>

  <!-- Glass Mantle -->
  <rect x="28" y="34" width="44" height="40" rx="9" fill="url(#gentleChamber)" stroke="url(#slateIron)" stroke-width="2.5"/>

  <!-- Protective Brass Struts -->
  <line x1="38" y1="34" x2="38" y2="74" stroke="url(#warmBrass)" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <line x1="62" y1="34" x2="62" y2="74" stroke="url(#warmBrass)" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- Glass Glare Highlight -->
  <path d="M32 38 C32 36, 36 35, 42 35" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Burner Base & Small Gentle Flame Ember -->
  <rect x="45" y="65" width="10" height="4" rx="1.5" fill="url(#warmBrass)"/>
  <!-- Gentle teardrop flame -->
  <path d="M50 46 C53 50, 58 54, 57 60 C56 65, 53 67, 50 67 C47 67, 44 65, 43 60 C42 54, 47 50, 50 46 Z" fill="url(#smallFlameGrad)"/>
  <ellipse cx="50" cy="61" rx="3" ry="4.5" fill="#FFFFFF" opacity="0.95"/>

  <!-- Reflective, Thoughtful Flame Eyes -->
  <ellipse cx="47.5" cy="57" rx="1.5" ry="2" fill="#78350F"/>
  <circle cx="48" cy="56.5" r="0.6" fill="#FFFFFF"/>
  <ellipse cx="52.5" cy="57" rx="1.5" ry="2" fill="#78350F"/>
  <circle cx="53" cy="56.5" r="0.6" fill="#FFFFFF"/>
  <!-- Gentle Encouraging Smile -->
  <path d="M48.5 61.5 Q50 63 51.5 61.5" stroke="#78350F" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- Base -->
  <rect x="24" y="73.5" width="52" height="4" rx="2" fill="url(#warmBrass)"/>
  <path d="M22 84 L26 77 L74 77 L78 84 Z" fill="url(#slateIron)"/>
  <rect x="20" y="83" width="60" height="5" rx="2.5" fill="url(#warmBrass)"/>
  <rect x="24" y="87" width="52" height="3" rx="1.5" fill="#0F172A"/>

  <ellipse cx="50" cy="91" rx="22" ry="3.5" fill="#0F172A" opacity="0.2"/>
</svg>